<!doctype html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="apple-mobile-web-app-title" content="Sismo 2026" />
		<!--
		  El favicon y el theme-color los pone el layout, distintos por sección
		  (directorio, mi lugar, veeduría). Acá solo queda el ícono de pantalla
		  de inicio, que siempre es el de la app pública.
		-->
		<link rel="apple-touch-icon" href="/favicon.svg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
